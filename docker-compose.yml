services:
  condominio-app:
    build:
      context: .
      target: production
    container_name: condominio-jmc-demo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_MODE: demo
      PORT: 3000
      TZ: America/Santiago
      APP_URL: http://localhost:${APP_PORT:-8090}
    ports:
      - "${APP_PORT:-8090}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
